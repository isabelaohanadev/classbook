# Mensagens do Bean Validation em português (Issue #44), para as anotações usadas nos *Request.
# Ficam no pacote padrão, sem sufixo de idioma, para valer em qualquer locale da JVM (o CI roda em inglês).
# Os @Size do projeto só usam max, por isso a mensagem fala apenas do tamanho máximo.
jakarta.validation.constraints.NotBlank.message=é obrigatório e não pode ficar em branco
jakarta.validation.constraints.NotNull.message=é obrigatório
jakarta.validation.constraints.Size.message=deve ter no máximo {max} caracteres
jakarta.validation.constraints.Past.message=deve ser uma data no passado
jakarta.validation.constraints.Pattern.message=está fora do formato esperado
org.hibernate.validator.constraints.URL.message=deve ser uma URL http ou https válida
