spring.application.name=classbook

# Banco de dados (PostgreSQL).
# Os valores vêm de variáveis de ambiente ou do arquivo local .env (ignorado pelo Git).
# Veja o .env.example e a seção "Configuração do banco" do README.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/classbook}
spring.datasource.username=${DB_USERNAME:classbook}
spring.datasource.password=${DB_PASSWORD}

# O schema é gerenciado pelo Flyway; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Mensagem das exceções de domínio (ver pacote exception) no corpo padrão de erro do Spring Boot,
# enquanto o tratador global (Issue #43) não padroniza esse corpo.
server.error.include-message=always
